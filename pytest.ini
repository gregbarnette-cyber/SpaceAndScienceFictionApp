[pytest]
# Run the suite with:  venv/bin/python -m pytest
# (Use the VENV python — a stray system-wide pytest runs on system Python, which
#  lacks this project's deps, e.g. numpy, and fails at collection. See CLAUDE.md.)
# pytest is THE runner. The tests are written as unittest.TestCase classes, which
# pytest collects natively — a style choice, not a second runner to maintain.
testpaths = tests
markers =
    cr26_network: a CR-26 test that mocks the CR-26 network seams itself (opts out of the conftest's
        forced allow_network=False + leak-stub isolation — tests/conftest.py)
    cr24_velocity: a CR-24 test that exercises the real velocity resolution and mocks its SIMBAD seams itself
        (opts out of the conftest's not-run velocity default — tests/conftest.py)
    cr27_identity: a CR-27 test that drives the real --star identity step (head → A) and stubs its lookup itself
        (opts out of the conftest's identity-unchanged default — tests/conftest.py)
